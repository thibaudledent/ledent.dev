name: Build and deploy

# Every push and pull request is built and type-checked.
# Nothing is published until the repository variable DEPLOY_ENABLED is set
# to "true" (Settings > Secrets and variables > Actions > Variables).
# See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild so the projects page follows GitHub.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
